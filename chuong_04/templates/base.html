<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Trang chủ{% endblock %} - Sông Hương</title>
    {% block styles %}
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
      }

      nav ul {
        display: flex;
        gap: 1rem;
        list-style: none;
        padding: 0;
      }

      footer {
        border-top: 1px solid #ccc;
        margin-top: 2rem;
        padding-top: 1rem;
      }
    </style>
    {% endblock %}
  </head>
  <body>
    {% include "_navbar.html" %}
    <main>{% block content %}{% endblock %}</main>
    {% include "_footer.html" %}
  </body>
</html>
