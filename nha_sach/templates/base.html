<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --shop-navy: #123f78;
      --shop-blue: #2864e8;
      --shop-green: #188348;
      --shop-border: #d3deeb;
      --shop-muted: #63748b;
    }
    body { background: #f4f7fb; color: #263445; }
    .navbar { background: var(--shop-navy) !important; border-bottom: 0 !important; }
    .navbar-brand, .navbar .nav-link { color: #fff !important; }
    .navbar-brand { font-size: 1rem; }
    .navbar .nav-link:hover, .navbar-brand:hover { color: #d9e8ff !important; }
    .navbar-toggler { border-color: rgba(255,255,255,.35); }
    .navbar-toggler-icon { filter: brightness(0) invert(1); }
    h4 { color: #185b39; font-weight: 700; }
    .badge-cart { font-size: .7rem; background: #f07819 !important; color: #fff !important; }
    .btn-primary { background: var(--shop-blue); border-color: var(--shop-blue); }
    .btn-outline-primary { color: var(--shop-blue); border-color: var(--shop-blue); }
    .card { border-color: var(--shop-border); border-radius: .65rem; }
    .card-book { transition: box-shadow .2s, transform .2s; }
    .card-book:hover { box-shadow: 0 5px 16px rgba(18,63,120,.12); transform: translateY(-2px); }
    .cover-thumb { width: 100%; height: 180px; object-fit: cover; background: #e2e8f0; }
    .cover-thumb-sm { width: 60px; height: 80px; object-fit: cover; }
    .text-muted { color: var(--shop-muted) !important; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    @media (max-width: 575.98px) {
      .container.py-4 { padding-top: 1.25rem !important; }
      .cover-thumb { height: 210px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% include '_navbar.html' %}

<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
